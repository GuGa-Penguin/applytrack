[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "applytrack"
version = "0.1.0"
description = "AI-powered job application tracker: parse postings, score fit, and track every application through to offer."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["job-search", "applicant-tracking", "fastapi", "claude", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27"]

[project.scripts]
applytrack = "applytrack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["applytrack"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
